<!doctype html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body class="home">
  <div class="backdrop" aria-hidden="true"></div>
  <main class="hero">
    <img class="hero-avatar" src="{{ site.profile_image | relative_url }}" alt="Photo of {{ site.title }}">
    <h1 class="hero-name">{{ site.title }}</h1>
    <p class="hero-tagline">{{ site.tagline }}</p>
    <div class="hero-sub">
      {% for line in site.subtitle %}<span>{{ line }}</span>{% endfor %}
      <span class="hero-location">{{ site.location }}</span>
    </div>
    <nav class="button-row" aria-label="Main">
      {% for item in site.data.navigation %}{% unless item.url == "/" %}
        <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% endunless %}{% endfor %}
    </nav>
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
