<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
{%- assign og_title = site.title | append: ", PhD" -%}
{%- if page.title and page.url != "/" -%}{%- assign og_title = page.title | append: " · " | append: og_title -%}{%- endif %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}, PhD">
<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.og_image | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:image:alt" content="Michael J. Wilson, PhD: computational physicist and data scientist">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<style>:root { --bg-image: url("{{ page.background_image | default: site.background_image | relative_url }}"); }</style>
